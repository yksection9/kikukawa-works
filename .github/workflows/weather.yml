# 予測ツール(飲食)用の天気を、毎朝1回だけ気象庁から取りに行き、public/data/weather/jp47.json を更新する。
# 変わったときだけ main にコミットし、Cloudflare Pages が自動で公開する。利用者のブラウザから気象庁へはアクセスしない。
name: weather
on:
  schedule:
    # GitHub の定期実行は混み合うと数時間遅れたり飛ばされたりするので、予備の時刻も置く。
    # 取得済みの日は scripts/fetch-weather.mjs が気象庁へ行かずに終わるので、取りに行くのは1日1回だけ
    - cron: "7 21 * * *" # 6:07(日本時間)。5時発表の予報が出たあと
    - cron: "7 23 * * *" # 8:07 予備
    - cron: "7 2 * * *" # 11:07 予備
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-weather.mjs
      - name: 変わっていたらコミット
        run: |
          git config user.name "weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/weather/jp47.json
          git diff --cached --quiet && exit 0
          git commit -m "天気を更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
